<style>
/* Layout: 견적 관리프로그램과 같은 ERP 셸 — 상단 앱바 / 왼쪽 메뉴 / 가운데 분석 패널 */

  --bar:#0A0F17; --bar-2:#131B28; --bar-ink:#E4EAF3; --bar-ink-2:#7F8EA6;
  --accent:#6E9BFF; --accent-ink:#0B1424; --accent-soft:#1B2A47; --y25:#4A5568; --y26:#6E9BFF;
  --ok:#2E9E6B; --ok-soft:#163327; --bad:#F28B82; --bad-soft:#3A1D1B; --tag:#F0A070; --tag-soft:#3A2619; --warn:#F28B82; color-scheme:dark}}

*{box-sizing:border-box}

(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('ko-KR');
const F={
  int:v=>nf.format(Math.round(v||0)),
  won:v=>nf.format(Math.round(v||0)),
  man:v=>{const a=Math.abs(v||0);return a>=1e8?(v/1e8).toFixed(2)+'억':nf.format(Math.round((v||0)/1e4))+'만'},
  pct:v=>v==null||!isFinite(v)?'–':(v*100).toFixed(1)+'%',
  dp:v=>v==null||!isFinite(v)?'–':Math.abs(v)<0.0005?'0.0%':(v>0?'+':'')+(v*100).toFixed(1)+'%',
  dw:v=>(v>0?'+':v<0?'−':'')+nf.format(Math.abs(Math.round(v||0))),
  dman:v=>(v>0?'+':v<0?'−':'')+F.man(Math.abs(v||0)),
};
const dcls=v=>v>0?'up':v<0?'dn':'zero';
const delta=(a,b)=>b?a/b-1:(a?Infinity:null);
const dHtml=(cur,prev,fmt='dp')=>{let d=fmt==='dp'?delta(cur,prev):cur-prev;if(fmt==='dp'&&d!=null&&isFinite(d)&&Math.abs(d)<0.0005)d=0;const t=fmt==='dp'?(d===Infinity?'신규':F.dp(d)):F.dman(d);return `<span class="d ${dcls(d===Infinity?1:d)}">${t}</span>`};

let P, R, COST, CUT, S={v:'sum',mode:'ytd',sku:'Bosu Professional',cq:'',cst:'',cc1:'',csort:{k:'a26',dir:-1},csel:null,team:'팀'};

function boot(payload){
  P=payload; COST=P.cost;
  R=P.rows.map(x=>{const [dt,item,q,a,cust,c1,c2,team,rep,type]=x;return {dt,y:+dt.slice(0,4),m:+dt.slice(5,7),md:dt.slice(5),item,q,a,cust,c1:c1||'기타',c2,team,rep,type,paid:a>0,pr:a>0?a-(COST[item]||0)*q:0}});
  CUT=P.meta.maxDate.slice(5);
  $('#appmeta').innerHTML=`출고 데이터 <b>${esc(P.meta.minDate)} ~ ${esc(P.meta.maxDate)}</b>`;
  $('#nChk').textContent=P.issues.filter(i=>i.level==='chk').length||'';
  $('#shell').hidden=false;
  $$('.nav[data-v]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
  const h=location.hash.slice(1); go(['sum','yoy','cust','sku','nego','chk'].includes(h)?h:'sum');
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>drawCharts(),120)});
}
function go(v){S.v=v;$$('.nav[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));history.replaceState(null,'','#'+v);render();window.scrollTo(0,0)}

/* ---------- 집계 ---------- */
const inP=(r,y)=>r.y===y&&(S.mode==='year'||r.md<=CUT);
const per=()=>S.mode==='ytd'?`1/1~${+CUT.slice(0,2)}/${+CUT.slice(3)}`:'연간';
const lab=y=>S.mode==='ytd'?`${String(y).slice(2)}년 ${per()}`:(y===2026?`26년 누적(~${+CUT.slice(0,2)}/${+CUT.slice(3)})`:`${String(y).slice(2)}년 연간`);
function agg(keyFn,filter){
  const m=new Map();
  for(const r of R){ if(!r.paid||(filter&&!filter(r)))continue;
    const k=keyFn(r); if(k==null)continue;
    let o=m.get(k); if(!o){o={k,q25:0,q26:0,a25:0,a26:0,p25:0,p26:0,n25:0,n26:0,c25:new Set(),c26:new Set(),qA25:0,aA25:0,last:'',first:'9999',team:'',rep:''};m.set(k,o)}
    if(r.y===2025){o.qA25+=r.q;o.aA25+=r.a}
    for(const y of [2025,2026]) if(inP(r,y)){const s=String(y).slice(2);o['q'+s]+=r.q;o['a'+s]+=r.a;o['p'+s]+=r.pr;o['n'+s]++;o['c'+s].add(r.cust)}
    if(r.dt>o.last){o.last=r.dt;o.team=r.team;o.rep=r.rep}
    if(r.dt<o.first)o.first=r.dt;
  }
  return [...m.values()];
}
function tot(rows){const t={q25:0,q26:0,a25:0,a26:0,p25:0,p26:0,n25:0,n26:0,qA25:0,aA25:0};for(const o of rows)for(const k in t)t[k]+=o[k];return t}

/* ---------- 공통 조각 ---------- */
const crumb=(t)=>`<div class="crumb">BOSU 분석 › <b>${t}</b><span class="sp"></span><span>비교 기간</span><div class="seg" role="group" aria-label="비교 기간"><button data-mode="ytd" class="${S.mode==='ytd'?'on':''}">같은 기간 (1/1~${+CUT.slice(0,2)}/${+CUT.slice(3)})</button><button data-mode="year" class="${S.mode==='year'?'on':''}">연간 (26년은 누적)</button></div></div>`;
function bindCrumb(){$$('.seg [data-mode]').forEach(b=>b.addEventListener('click',()=>{S.mode=b.dataset.mode;render()}))}
const legend=()=>`<div class="legend"><span><i style="background:var(--y25)"></i>2025년</span><span><i style="background:var(--y26)"></i>2026년</span></div>`;
const panel=(title,sub,body,extra='')=>`<section class="panel"><div class="ph"><h2>${title}</h2><span class="sub">${sub||''}</span><span class="sp"></span>${extra}</div>${body}</section>`;

/* compare table: rows of agg, first col label */
function cmpTable(rows,label,opts={}){
  const t=tot(rows), share=o=>t.a26?o.a26/t.a26:0, share25=o=>t.a25?o.a25/t.a25:0;
  const pp=o=>{const v=(share(o)-share25(o))*100;return `<span class="d ${Math.abs(v)<0.05?'zero':v>0?'up':'dn'}">${Math.abs(v)<0.05?'0.0':(v>0?'+':'')+v.toFixed(1)}%p</span>`};
  const body=rows.map(o=>`<tr><td class="name"><b>${esc(o.k)}</b>${opts.sub?`<div class="mut" style="font-size:11px">${esc(opts.sub(o))}</div>`:''}</td>
    <td class="r">${F.int(o.q25)}</td><td class="r">${F.int(o.q26)}</td>
    <td class="r">${F.won(o.a25)}</td><td class="r">${F.won(o.a26)}</td>

const charts=[];

function tipShow(el,tip,x,y,html){tip.innerHTML=html;tip.hidden=false;const w=tip.offsetWidth,W=el.clientWidth;tip.style.left=Math.max(0,Math.min(W-w,x-w/2))+'px';tip.style.top=Math.max(0,y-tip.offsetHeight-10)+'px'}
function axis(v,n=4){const st=niceMax(v/n);const mx=Math.ceil(v/st)*st||st;const t=[];for(let x=0;x<=mx+st/2;x+=st)t.push(x);return {max:mx,ticks:t,step:st}}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function monthlyChart(el){
  const W=Math.max(300,el.clientWidth),H=250,mt=12,mb=26;

  const ax=axis(Math.max(...mm.map(o=>Math.max(o.a25,o.a26))));const max=ax.max,ticks=ax.ticks;const fy=v=>nf.format(v/1e6);
  const ml=12+7*fy(max).length, x0=ml, cw=(W-x0-4)/12, bw=Math.min(18,cw*.36);

  for(const t of ticks)s+=`<line class="gl" x1="${x0}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}"/><text class="tk" x="${x0-6}" y="${y(t)}" dy=".32em" text-anchor="end">${fy(t)}</text>`;
  mm.forEach((o,i)=>{const cx=x0+cw*i+cw/2;
    s+=`<rect x="${cx-bw-1}" y="${y(o.a25)}" width="${bw}" height="${y(0)-y(o.a25)}" rx="2" fill="var(--y25)"/>`;
    if(o.a26||o.m<=+CUT.slice(0,2))s+=`<rect x="${cx+1}" y="${y(o.a26)}" width="${bw}" height="${y(0)-y(o.a26)}" rx="2" fill="var(--y26)"/>`;
    s+=`<text class="tk" x="${cx}" y="${H-8}" text-anchor="middle">${o.m}월</text><rect data-i="${i}" x="${x0+cw*i}" y="${mt}" width="${cw}" height="${H-mt-mb}" fill="transparent"/>`});
  s+=`<text class="tk" x="${x0}" y="${mt-2}">백만원</text></svg><div class="tip" hidden></div>`;
  el.innerHTML=s;const tip=$('.tip',el),sc=()=>el.clientWidth/W;
  $$('rect[data-i]',el).forEach(rc=>{rc.addEventListener('mouseenter',()=>{const o=mm[+rc.dataset.i];const part=o.m===+CUT.slice(0,2)?` (26년은 ${+CUT.slice(3)}일까지)`:'';
    tipShow(el,tip,(+rc.getAttribute('x')+cw/2)*sc(),y(Math.max(o.a25,o.a26))*sc(),`<div class="h">${o.m}월${part}</div><div class="row"><span><i style="background:var(--y25)"></i>2025</span><span class="num">${F.won(o.a25)}원 · ${F.int(o.q25)}개</span></div><div class="row"><span><i style="background:var(--y26)"></i>2026</span><span class="num">${o.m>+CUT.slice(0,2)?'–':F.won(o.a26)+'원 · '+F.int(o.q26)+'개'}</span></div>${o.m<=+CUT.slice(0,2)?`<div class="row"><span>증감</span>${dHtml(o.a26,o.a25)}</div>`:''}`)});
    rc.addEventListener('mouseleave',()=>tip.hidden=true)});
}
function cumChart(el){
  const W=Math.max(300,el.clientWidth),H=230,mt=14,mb=26;
  const cm=+CUT.slice(0,2);

  for(let m=1;m<=12;m++){for(const r of R)if(r.paid&&r.m===m){if(r.y===2025)s25+=r.a;if(r.y===2026)s26+=r.a}c25.push(s25);if(m<=cm)c26.push(s26)}
  const ax=axis(Math.max(s25,s26));const max=ax.max;const dg=ax.step%1e8?(ax.step%1e7?2:1):0;const fy=v=>(v/1e8).toFixed(dg);

  for(let i=0;i<12;i+=1)if(i%2===0||W>520)s+=`<text class="tk" x="${X(i)}" y="${H-8}" text-anchor="middle">${i+1}월</text>`;

/* ---------- 팀별 비중 ---------- */
const ME='웰리플사업팀';
function teamGroups(){
  const rows=agg(r=>r.team).sort((a,b)=>(b.a25+b.a26)-(a.a25+a.a26));
  const me=rows.find(o=>o.k===ME);
  const keep=[...(me?[me]:[]),...rows.filter(o=>o.k!==ME).slice(0,5)];
  const rest=rows.filter(o=>!keep.includes(o));
  const list=keep.map((o,i)=>({...o,c:`var(--t${i+1})`}));
  if(rest.length){const s=tot(rest);list.push({...s,k:`기타 ${rest.length}개 팀`,c:'var(--t8)',etc:rest.map(o=>o.k).join(', ')})}
  return {list,t:tot(rows)};
}
function teamShare(){
  const {list,t}=teamGroups();

  const stack=y=>`<div class="stack" role="img" aria-label="${y}년 팀별 비중">${list.map(o=>{const s=sh(o,y);return s>0?`<span style="width:${(s*100).toFixed(2)}%;background:${o.c}" title="${esc(o.k)} ${F.pct(s)}">${s>=0.09?esc(o.k.replace('사업팀','').replace('영업팀','영업').replace('팀',''))+' '+F.pct(s):s>=0.04?F.pct(s):''}</span>`:''}).join('')}</div>`;
  const rowsH=list.map(o=>{const s25=sh(o,25),s26=sh(o,26),v=(s26-s25)*100;const mx=Math.max(...list.map(x=>Math.max(sh(x,25),sh(x,26))));

      </div>
      <div class="chg"><span class="pp ${Math.abs(v)<0.05?'':v>0?'d up':'d dn'}">${Math.abs(v)<0.05?'0.0':(v>0?'+':'')+v.toFixed(1)}%p</span><small>금액 ${o.a25?F.dp(delta(o.a26,o.a25)):'신규'}</small></div></div>`}).join('');

function custMonthly(el){
  if(!el)return;const W=Math.max(300,el.clientWidth),H=180,mt=10,mb=24;
  const mm=Array.from({length:12},(_,i)=>({m:i+1,a25:0,a26:0}));
  for(const r of R)if(r.paid&&r.cust===S.csel){if(r.y===2025)mm[r.m-1].a25+=r.a;if(r.y===2026)mm[r.m-1].a26+=r.a}
  const ax=axis(Math.max(1,...mm.map(o=>Math.max(o.a25,o.a26))),2);const max=ax.max;const fy=v=>F.man(v);
  const ml=14+7*fy(max).length,cw=(W-ml-4)/12,bw=Math.min(16,cw*.36),y=v=>H-mb-(v/max)*(H-mt-mb);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 출고금액">`;
  for(const t of ax.ticks)s+=`<line class="gl" x1="${ml}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}"/><text class="tk" x="${ml-6}" y="${y(t)}" dy=".32em" text-anchor="end">${fy(t)}</text>`;
  mm.forEach((o,i)=>{const cx=ml+cw*i+cw/2;if(o.a25)s+=`<rect x="${cx-bw-1}" y="${y(o.a25)}" width="${bw}" height="${y(0)-y(o.a25)}" rx="2" fill="var(--y25)"><title>25년 ${o.m}월 ${F.won(o.a25)}원</title></rect>`;if(o.a26)s+=`<rect x="${cx+1}" y="${y(o.a26)}" width="${bw}" height="${y(0)-y(o.a26)}" rx="2" fill="var(--y26)"><title>26년 ${o.m}월 ${F.won(o.a26)}원</title></rect>`;s+=`<text class="tk" x="${cx}" y="${H-7}" text-anchor="middle">${o.m}</text>`});
  el.innerHTML=s+'</svg>';
}

/* ---------- 렌더 ---------- */
function render(){
  charts.length=0;
  const m=$('#main');
  if(S.v==='sum'){m.innerHTML=vSum();charts.push({id:'cMonthly',fn:monthlyChart},{id:'cCum',fn:cumChart})}
  else if(S.v==='yoy')m.innerHTML=vYoy();
  else if(S.v==='cust'){m.innerHTML=vCust();fillCust();custDetail();charts.push({id:'cCustM',fn:custMonthly});
    $('#cq').addEventListener('input',e=>{S.cq=e.target.value.trim();fillCust()});
    $('#cst').addEventListener('change',e=>{S.cst=e.target.value;fillCust()});
    $('#cc1').addEventListener('change',e=>{S.cc1=e.target.value;fillCust()});
    $$('#ctab th button').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;S.csort={k,dir:S.csort.k===k?-S.csort.dir:(['k','c1','rep','st'].includes(k)?1:-1)};$$('#ctab th').forEach(th=>th.removeAttribute('aria-sort'));b.parentElement.setAttribute('aria-sort',S.csort.dir>0?'ascending':'descending');fillCust()}));}
  else if(S.v==='nego')m.innerHTML=vNego();
  else if(S.v==='sku'){m.innerHTML=vSku();$('#skuSel').addEventListener('change',e=>{S.sku=e.target.value;render()})}
  else m.innerHTML=vChk();
  $('#nCust').textContent=new Set(R.filter(r=>r.paid&&(inP(r,2025)||inP(r,2026))).map(r=>r.cust)).size;
  bindCrumb();drawCharts();
}

/* ---------- 잠금 ---------- */
const b64=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
const wrap=document.createElement('div');wrap.className='lock';
wrap.innerHTML='<form id="lockf" autocomplete="off"><h2>웰리플사업팀 BOSU 출고분석</h2><div class="by">by PDS</div><p>팀 전용 화면입니다. 비밀번호를 입력하세요.</p><input id="lockpw" type="password" inputmode="numeric" autocomplete="current-password" aria-label="비밀번호" autofocus><div class="err" id="lockerr"></div><button type="submit" id="lockbtn">열기</button></form>';
document.body.appendChild(wrap);
const f=$('#lockf'),inp=$('#lockpw'),err=$('#lockerr'),btn=$('#lockbtn');
setTimeout(()=>inp.focus(),50);
f.addEventListener('submit',async e=>{e.preventDefault();if(!inp.value)return;btn.disabled=true;btn.textContent='여는 중…';err.textContent='';
  try{
    if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(inp.value),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:E.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    let pt;try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.i)},k,b64(E.c))}catch(x){throw new Error('bad')}
    const o=JSON.parse(new TextDecoder().decode(pt));wrap.remove();boot(o);
  }catch(x){console.error(x);err.textContent=x.message==='bad'?'비밀번호가 맞지 않습니다.':'이 브라우저에서는 열 수 없습니다. 크롬이나 엣지로 열어 주세요.';inp.select();btn.disabled=false;btn.textContent='열기'}
});
})();
</script>
</body></html>
